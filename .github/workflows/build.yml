name: Build

on:
  workflow_dispatch:

env:
  CMAKE_INSTALL_PARALLEL_LEVEL: 4

jobs:
  amd64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Optimized layout: Keeping only target production Ubuntu systems
        name: [Ubuntu-22, Ubuntu-24, Ubuntu-26]
        cpp_compiler: [g++]
        include:
          - name: Ubuntu-22
            image: "ubuntu:22.04"
            ubuntu: 22
            deps: cmake g++ libusb-1.0-0-dev qtbase5-dev qttools5-dev pkgconf udev file
          - name: Ubuntu-24
            image: "ubuntu:24.04"
            ubuntu: 24
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools systemd-dev file
          - name: Ubuntu-26
            image: "ubuntu:26.04"
            ubuntu: 26
            deps: cmake g++ libusb-1.0-0-dev pkgconf qt6-base-dev qt6-tools-dev linguist-qt6 qt6-l10n-tools qt6-base-dev-tools qt6-tools-dev-tools systemd-dev file
    container:
      image: ${{ matrix.image }}
      env:
        LANG: en_US.UTF-8
        CC: ${{ matrix.c_compiler }}
        CXX: ${{ matrix.cpp_compiler }}
        WITH_PROJ: ON
        APT_LISTCHANGES_FRONTEND: none
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install packages required
        shell: bash
        run: |
          echo "Installing dependencies for ${{ matrix.name }}"
          apt-get update -qq
          apt-get install -yq ${{ matrix.deps }}
      
      - uses: actions/checkout@v7
      
      - name: Build and Package DEB
        working-directory: .
        run: |
          cmake -S . -B build/ -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ --parallel
          cmake --install build/
          
          cd build
          cpack -G DEB \
            -D CPACK_PACKAGE_NAME="sfp-master" \
            -D CPACK_PACKAGE_VENDOR="BigBigMDM" \
            -D CPACK_PACKAGE_VERSION="1.8.6" \
            -D CPACK_PACKAGE_DESCRIPTION_SUMMARY="SFP-Master - SFP-Module Flash Programmer Suite" \
            -D CPACK_PACKAGE_DESCRIPTION="SFP-Master is a Linux/macOS programmer suite for SFP-Modules data modify" \
            -D CPACK_PACKAGE_CONTACT="BigBigMDM <https://github.com>" \
            -D CPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="amd64" \
            -D CPACK_INSTALL_CMAKE_PROJECTS=".;SFP-Master;ALL;/" \
            -D CPACK_PACKAGE_FILE_NAME="sfp-master" \
            -D CPACK_CMAKE_GENERATOR="Unix Makefiles"
          
          mkdir -p ../dist-deb
          mv sfp-master*.deb ../dist-deb/sfp-master-${{ matrix.name }}-amd64.deb

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@main
        with:
          name: deb-${{ matrix.name }}
          path: dist-deb/*.deb
